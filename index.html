<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Minificação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Minificador de Código</h1>
            <p>Minifique HTML, CSS e JavaScript</p>
        </header>

        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <i class="upload-icon">📁</i>
                <h3>Arraste seu arquivo aqui</h3>
                <p>ou</p>
                <button class="btn-primary" id="selectFileBtn">Selecionar Arquivo</button>
                <input type="file" id="fileInput" accept=".html,.htm,.js,.css" hidden>
            </div>
        </div>

        <div class="options-panel" id="optionsPanel" style="display: none;">
            <div class="file-info">
                <h4>Arquivo: <span id="fileName"></span></h4>
                <p>Tipo: <span id="fileType"></span></p>
            </div>
            
            <div class="minify-options">
                <h4>Opções de Minificação:</h4>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="checkbox" id="removeComments" checked>
                        Remover comentários
                    </label>
                    <label class="option-item">
                        <input type="checkbox" id="removeSpaces" checked>
                        Remover espaços extras
                    </label>
                    <label class="option-item">
                        <input type="checkbox" id="removeLineBreaks" checked>
                        Remover quebras de linha
                    </label>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-secondary" id="minifyBtn">Minificar</button>
                <button class="btn-primary" id="downloadBtn" style="display: none;">Download</button>
                <button class="btn-copy" id="copyBtn" style="display: none;">Copiar Código</button>
            </div>
        </div>

        <div class="result-area" id="resultArea" style="display: none;">
            <div class="result-header">
                <h4>Resultado da Minificação</h4>
                <div class="stats">
                    <span id="originalSize"></span>
                    <span>→</span>
                    <span id="minifiedSize"></span>
                    <span id="reduction"></span>
                </div>
            </div>
            <div class="code-preview">
                <pre id="minifiedCode"></pre>
            </div>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Minificando...</p>
        </div>
    </div>

    <script src="js/minifiers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
